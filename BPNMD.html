<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>人声带多通道抗学习掩蔽器 · 白色主题</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            background: #f4f6fa; /* 白色调背景 */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            color: #222;
        }
        .app-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 24px 24px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.04);
        }
        @media (max-width: 700px) { .app-container { padding: 14px; } }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px; flex-wrap: wrap; gap: 6px;
        }
        .header-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .header-left .icon { font-size: 28px; }
        .header-left h1 { font-size: 20px; font-weight: 600; color: #2c3e50; }
        .header-left .sub { font-size: 11px; color: #6c7a8a; padding: 2px 12px; border-radius: 16px; background: rgba(0,0,0,0.04); }
        .status-badge { font-size: 11px; padding: 4px 12px; border-radius: 30px; background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.06); color: #5a6a7a; display: flex; align-items: center; gap: 4px; }
        .status-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #b0b8c8; transition: 0.3s; }
        .status-badge.active .dot { background: #27ae60; box-shadow: 0 0 12px rgba(39,174,96,0.35); }
        .status-badge.active { color: #2c3e50; border-color: rgba(39,174,96,0.3); }

        .channels-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px 14px;
            margin-bottom: 14px;
        }
        @media (max-width: 800px) { .channels-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 500px) { .channels-grid { grid-template-columns: 1fr; } }

        .channel-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 12px 12px;
            border: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .channel-card:hover { background: #fafcff; }
        .ch-title { font-size: 11px; font-weight: 600; color: #2c3e50; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .ch-title .ch-num { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; background: #eef2f7; border-radius: 50%; font-size: 10px; }
        .ch-controls { display: flex; flex-direction: column; gap: 5px; }
        .ch-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .ch-row label { font-size: 9px; color: #6c7a8a; min-width: 30px; }
        .ch-row input[type="number"] {
            background: #f0f2f5; border: 1px solid #d0d6e0; border-radius: 8px;
            padding: 4px 4px; color: #222; font-size: 11px; font-weight: 500;
            width: 44px; text-align: center; -moz-appearance: textfield; outline: none;
        }
        .ch-row input[type="number"]:focus { border-color: #3498db; box-shadow: 0 0 0 2px rgba(52,152,219,0.15); }
        .ch-row input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .ch-row .unit-label { font-size: 9px; color: #8a9aaa; }
        .ch-row .range-sep { color: #8a9aaa; font-size: 10px; }

        .aux-chooser { display: flex; gap: 3px; margin-top: 3px; }
        .aux-chooser button {
            background: #eef2f7; border: 1px solid #d0d6e0;
            color: #2c3e50; padding: 2px 6px; border-radius: 14px; font-size: 8px; cursor: pointer;
            font-weight: 500; transition: 0.15s; flex: 1;
        }
        .aux-chooser button.active { background: #3498db; border-color: #3498db; color: #fff; }
        .aux-chooser button:hover { background: #d6e4f0; }

        .global-controls {
            display: flex;
            gap: 10px 18px;
            flex-wrap: wrap;
            background: #f8faff;
            border-radius: 20px;
            padding: 10px 14px;
            margin-bottom: 12px;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .global-controls .g-item { display: flex; align-items: center; gap: 4px; }
        .global-controls .g-item label { font-size: 10px; color: #5a6a7a; }
        .global-controls .g-item input[type="number"] {
            background: #f0f2f5; border: 1px solid #d0d6e0;
            border-radius: 8px; padding: 3px 5px; color: #222; font-size: 11px;
            width: 42px; text-align: center; -moz-appearance: textfield;
        }
        .global-controls .g-item .unit-label { font-size: 9px; color: #8a9aaa; }

        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 8px 12px;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) { .monitor-grid { grid-template-columns: 1fr 1fr; } }
        .monitor-item {
            background: #ffffff;
            border-radius: 12px;
            padding: 6px 10px 8px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .monitor-item .m-label { font-size: 9px; color: #6c7a8a; }
        .monitor-item .m-value { font-size: 16px; font-weight: 600; color: #2c3e50; }
        .monitor-item .m-bar { margin-top: 2px; height: 2px; background: #e0e6ee; border-radius: 4px; overflow: hidden; }
        .monitor-item .m-bar-fill { height: 100%; background: linear-gradient(90deg, #3498db, #9b59b6); }

        .action-row {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .btn {
            padding: 6px 16px; border: none; border-radius: 40px; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center;
            gap: 4px; background: rgba(0,0,0,0.04); color: #2c3e50; border: 1px solid rgba(0,0,0,0.06);
        }
        .btn:hover { transform: translateY(-1px); background: rgba(0,0,0,0.08); }
        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9); color: #fff; border: none;
            box-shadow: 0 4px 20px rgba(52,152,219,0.30);
        }
        .btn-primary:hover { box-shadow: 0 6px 28px rgba(52,152,219,0.40); background: linear-gradient(135deg, #3ea0e0, #2c86c4); }
        .btn-primary.active { background: linear-gradient(135deg, #e74c3c, #c0392b); box-shadow: 0 4px 20px rgba(231,76,60,0.30); }
        .btn-primary.active:hover { background: linear-gradient(135deg, #f05a4a, #d04535); }
        .btn-secondary { background: rgba(0,0,0,0.04); color: #5a6a7a; }
        .action-info { font-size: 9px; color: #6c7a8a; margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
        .action-info .fade { color: #a0b0c0; }
        .no-select { user-select: none; }
        .hint { font-size: 7px; color: #8a9aaa; margin-top: 2px; }
        @media (max-width: 600px) {
            .global-controls { gap: 4px 8px; padding: 6px 10px; }
            .ch-row input[type="number"] { width: 36px; font-size: 10px; }
            .monitor-item .m-value { font-size: 14px; }
            .channel-card { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="app-container no-select">
        <div class="header">
            <div class="header-left">
                <span class="icon">🧩</span>
                <h1>人声带噪声掩蔽器</h1>
                <span class="sub"> ·多通道抗学习·</span>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">待命</span>
            </div>
        </div>

        <!-- 三通道 -->
        <div class="channels-grid">
            <!-- 通道1：主高通 -->
            <div class="channel-card">
                <div class="ch-title"><span class="ch-num">1</span> 主高通·中高频</div>
                <div class="ch-controls">
                    <div class="ch-row">
                        <label>HP</label>
                        <input type="number" id="ch1_hp" value="550" min="50" max="800" step="5" />
                        <span class="unit-label">Hz</span>
                    </div>
                    <div class="ch-row">
                        <label>Vol</label>
                        <input type="number" id="ch1_volMin" value="20" min="0" max="100" step="1" style="width:32px;" />
                        <span class="range-sep">—</span>
                        <input type="number" id="ch1_volMax" value="70" min="0" max="100" step="1" style="width:32px;" />
                        <span class="unit-label">%</span>
                    </div>
                    <div class="ch-row">
                        <label>Q</label>
                        <input type="number" id="ch1_q" value="0.7" min="0.1" max="10" step="0.1" style="width:36px;" />
                    </div>
                    <div class="aux-chooser" id="ch1_type">
                        <button data-type="pink" class="active">粉红</button>
                        <button data-type="white">白</button>
                        <button data-type="chaos">混沌</button>
                    </div>
                    <div class="hint">高通±120Hz 飘移 · Q值随机</div>
                </div>
            </div>
            <!-- 通道2：低频掩蔽 -->
            <div class="channel-card">
                <div class="ch-title"><span class="ch-num">2</span> 低频专杀·基频</div>
                <div class="ch-controls">
                    <div class="ch-row">
                        <label>LPF</label>
                        <input type="number" id="ch2_lpf" value="200" min="30" max="500" step="5" />
                        <span class="unit-label">Hz</span>
                    </div>
                    <div class="ch-row">
                        <label>Vol</label>
                        <input type="number" id="ch2_vol" value="50" min="0" max="100" step="1" style="width:44px;" />
                        <span class="unit-label">%</span>
                    </div>
                    <div class="ch-row">
                        <label>Sub</label>
                        <input type="number" id="ch2_sub" value="40" min="0" max="100" step="1" style="width:36px;" />
                        <span class="unit-label">%</span>
                        <span style="font-size:8px;color:#8a9aaa;">(低频振荡)</span>
                    </div>
                    <div class="aux-chooser" id="ch2_type">
                        <button data-type="pink" class="active">粉红</button>
                        <button data-type="water">水流</button>
                        <button data-type="sin">正弦</button>
                    </div>
                    <div class="hint">LPF 80~350Hz 飘移 · 含次低频振荡</div>
                </div>
            </div>
            <!-- 通道3：辅助混沌 -->
            <div class="channel-card">
                <div class="ch-title"><span class="ch-num">3</span> 辅助混沌·全频</div>
                <div class="ch-controls">
                    <div class="ch-row">
                        <label>HP</label>
                        <input type="number" id="ch3_hp" value="100" min="10" max="800" step="5" />
                        <span class="unit-label">Hz</span>
                    </div>
                    <div class="ch-row">
                        <label>Vol</label>
                        <input type="number" id="ch3_vol" value="35" min="0" max="100" step="1" style="width:44px;" />
                        <span class="unit-label">%</span>
                    </div>
                    <div class="ch-row">
                        <label>Phase</label>
                        <input type="number" id="ch3_phaseDelay" value="0" min="0" max="500" step="10" style="width:40px;" />
                        <span class="unit-label">ms</span>
                    </div>
                    <div class="aux-chooser" id="ch3_type">
                        <button data-type="chaos" class="active">混沌</button>
                        <button data-type="white">白噪</button>
                        <button data-type="water">水流</button>
                    </div>
                    <div class="hint">高通乱飘 · 相位延迟随机</div>
                </div>
            </div>
        </div>

        <!-- 全局控制 -->
        <div class="global-controls">
            <div class="g-item">
                <label>⏱️ 突变概率</label>
                <input type="number" id="globalMutate" value="75" min="0" max="100" step="5" />
                <span class="unit-label">%</span>
            </div>
            <div class="g-item">
                <label>🌀 抗学习</label>
                <input type="number" id="globalDepth" value="100" min="10" max="100" step="5" />
                <span class="unit-label">%</span>
            </div>
            <div class="g-item">
                <label>🎚️ 总增益</label>
                <input type="number" id="globalGain" value="75" min="0" max="100" step="1" />
                <span class="unit-label">%</span>
            </div>
            <div style="display:flex;gap:6px;margin-left:auto;">
                <span style="font-size:9px;color:#8a9aaa;" id="complexityInfo">复杂度: 极高</span>
            </div>
        </div>

        <!-- 实时监测 -->
        <div class="monitor-grid">
            <div class="monitor-item"><div class="m-label">通道1 HP</div><div class="m-value" id="m1hp">550Hz</div><div class="m-bar"><div class="m-bar-fill" style="width:69%;"></div></div></div>
            <div class="monitor-item"><div class="m-label">通道2 LPF</div><div class="m-value" id="m2lpf">200Hz</div><div class="m-bar"><div class="m-bar-fill" style="width:40%;"></div></div></div>
            <div class="monitor-item"><div class="m-label">通道3 HP</div><div class="m-value" id="m3hp">100Hz</div><div class="m-bar"><div class="m-bar-fill" style="width:50%;"></div></div></div>
            <div class="monitor-item"><div class="m-label">噪音复杂度</div><div class="m-value" id="mComplex">75%</div><div class="m-bar"><div class="m-bar-fill" style="width:75%;"></div></div></div>
        </div>

        <div class="action-row">
            <button class="btn btn-primary" id="mainToggle"><span class="icon-btn">▶</span><span id="toggleLabel">启动掩蔽</span></button>
            <button class="btn btn-secondary" id="resetBtn"><span class="icon-btn">↺</span> 重置</button>
            <div class="action-info">
                <span id="qualityDisp">📊 三通道 | 白色主题</span>
                <span class="fade" id="statusDetail">抗学习深度 100%</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            const $ = id => document.getElementById(id);
            const ch1_typeBtns = document.querySelectorAll('#ch1_type button');
            const ch2_typeBtns = document.querySelectorAll('#ch2_type button');
            const ch3_typeBtns = document.querySelectorAll('#ch3_type button');

            const ch1_hp = $('ch1_hp'), ch1_volMin = $('ch1_volMin'), ch1_volMax = $('ch1_volMax'), ch1_q = $('ch1_q');
            const ch2_lpf = $('ch2_lpf'), ch2_vol = $('ch2_vol'), ch2_sub = $('ch2_sub');
            const ch3_hp = $('ch3_hp'), ch3_vol = $('ch3_vol'), ch3_phaseDelay = $('ch3_phaseDelay');
            const globalMutate = $('globalMutate'), globalDepth = $('globalDepth'), globalGain = $('globalGain');

            const statusBadge = $('statusBadge'), statusText = $('statusText'), statusDetail = $('statusDetail');
            const mainToggle = $('mainToggle'), toggleLabel = $('toggleLabel'), resetBtn = $('resetBtn');
            const m1hp = $('m1hp'), m2lpf = $('m2lpf'), m3hp = $('m3hp'), mComplex = $('mComplex');
            const qualityDisp = $('qualityDisp');

            // ========== 音频状态 ==========
            let isPlaying = false;
            let audioCtx = null;
            let masterGain = null;
            let analyser = null, dataArray = null;
            // 三个通道的节点
            let ch1_gain = null, ch1_filter = null, ch1_source = null;
            let ch2_gain = null, ch2_filter = null, ch2_source = null;
            let ch3_gain = null, ch3_filter = null, ch3_source = null;
            // 低频次声振荡器 (ch2)
            let ch2_subOsc = null, ch2_subGain = null;
            let isInit = false;

            // 基础参数与漂移后值
            const baseParams = {
                ch1: { hp:550, volMin:20, volMax:70, q:0.7, type:'pink' },
                ch2: { lpf:200, vol:50, sub:40, type:'pink' },
                ch3: { hp:100, vol:35, phaseDelay:0, type:'chaos' },
                global: { mutate:75, depth:100, gain:75 }
            };
            const drifted = {
                ch1: { hp:550, volMin:20, volMax:70, q:0.7 },
                ch2: { lpf:200, vol:50, sub:40 },
                ch3: { hp:100, vol:35, phaseDelay:0 }
            };
            const lastValid = {
                ch1_hp:550, ch1_q:0.7,
                ch2_lpf:200, ch2_vol:50, ch2_sub:40,
                ch3_hp:100, ch3_vol:35, ch3_phase:0
            };

            let driftTimer = null, mutateTimer = null, updateTimer = null, animId = null;
            let totalComplexity = 0;

            // ========== 工具 ==========
            function clamp(v,min,max) { return Math.min(Math.max(v,min),max); }
            function rand(min,max) { return min + Math.random()*(max-min); }

            // ========== 噪声生成 ==========
            function generatePinkBuffer(ctx, lenSec=4) {
                const sr=ctx.sampleRate, L=sr*lenSec;
                const buf=ctx.createBuffer(1,L,sr), d=buf.getChannelData(0);
                let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
                for(let i=0;i<L;i++){
                    const w=Math.random()*2-1;
                    b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;
                    b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;
                    b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;
                    let p=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
                    b6=w*0.115926; if(p>1)p=1;if(p<-1)p=-1; d[i]=p;
                }
                return buf;
            }
            function generateWhiteBuffer(ctx, lenSec=4) {
                const sr=ctx.sampleRate, L=sr*lenSec;
                const buf=ctx.createBuffer(1,L,sr), d=buf.getChannelData(0);
                for(let i=0;i<L;i++) d[i]=Math.random()*2-1;
                return buf;
            }
            function generateChaosBuffer(ctx, lenSec=5) {
                const sr=ctx.sampleRate, L=sr*lenSec;
                const buf=ctx.createBuffer(1,L,sr), d=buf.getChannelData(0);
                let x=0.3+Math.random()*0.4, y=0.7+Math.random()*0.3;
                for(let i=0;i<L;i++){
                    x=3.9*x*(1-x)+0.1*Math.sin(y*20); y=0.8*y+0.2*Math.sin(x*30);
                    if(x>1)x=1-0.001;if(x<0)x=0.001;if(y>1)y=1;if(y<0)y=0;
                    let val=(x-0.5)*2*0.9+(Math.random()-0.5)*0.2;
                    val+=Math.sin(i*0.01+x*100)*0.1;
                    if(val>1)val=1;if(val<-1)val=-1; d[i]=val;
                }
                return buf;
            }
            function generateWaterBuffer(ctx, lenSec=4) {
                const sr=ctx.sampleRate, L=sr*lenSec;
                const buf=ctx.createBuffer(1,L,sr), d=buf.getChannelData(0);
                let pt=0;
                for(let i=0;i<L;i++){
                    const t=i/sr;
                    const mod=0.5+0.5*Math.sin(2*Math.PI*3.2*t+Math.sin(2*Math.PI*0.7*t)*0.5);
                    pt-=1; let pulse=0;
                    if(pt<=0){ if(Math.random()<0.015){pulse=(Math.random()*2-1)*(0.3+Math.random()*0.7);pt=Math.floor(50+Math.random()*200);}else{pt=1+Math.floor(Math.random()*20);} }
                    const base=Math.random()*2-1;
                    d[i]=clamp(base*mod*0.8+pulse*0.4+(Math.random()*2-1)*0.15,-1,1);
                }
                return buf;
            }
            function generateSinBuffer(ctx, lenSec=4) {
                const sr=ctx.sampleRate, L=sr*lenSec;
                const buf=ctx.createBuffer(1,L,sr), d=buf.getChannelData(0);
                const f_base=80+Math.random()*120;
                for(let i=0;i<L;i++){
                    d[i]=Math.sin(2*Math.PI*f_base*i/sr)*(0.2+0.3*Math.sin(2*Math.PI*3*i/sr));
                }
                return buf;
            }

            // ========== 初始化音频 ==========
            function initAudio() {
                if(isInit) return;
                try{
                    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
                    masterGain = audioCtx.createGain(); masterGain.gain.value=0;
                    analyser = audioCtx.createAnalyser(); analyser.fftSize=256; analyser.smoothingTimeConstant=0.8;
                    masterGain.connect(analyser); analyser.connect(audioCtx.destination);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);

                    // 通道1
                    ch1_gain = audioCtx.createGain(); ch1_gain.gain.value=0;
                    ch1_filter = audioCtx.createBiquadFilter(); ch1_filter.type='highpass';
                    ch1_filter.frequency.value=baseParams.ch1.hp; ch1_filter.Q.value=baseParams.ch1.q;
                    ch1_gain.connect(ch1_filter); ch1_filter.connect(masterGain);

                    // 通道2
                    ch2_gain = audioCtx.createGain(); ch2_gain.gain.value=0;
                    ch2_filter = audioCtx.createBiquadFilter(); ch2_filter.type='lowpass';
                    ch2_filter.frequency.value=baseParams.ch2.lpf; ch2_filter.Q.value=1;
                    ch2_subGain = audioCtx.createGain(); ch2_subGain.gain.value=0.3;
                    ch2_subOsc = audioCtx.createOscillator(); ch2_subOsc.type='sine'; ch2_subOsc.frequency.value=40+Math.random()*20;
                    ch2_subOsc.connect(ch2_subGain); ch2_subGain.connect(ch2_gain); ch2_subOsc.start();
                    ch2_gain.connect(ch2_filter); ch2_filter.connect(masterGain);

                    // 通道3
                    ch3_gain = audioCtx.createGain(); ch3_gain.gain.value=0;
                    ch3_filter = audioCtx.createBiquadFilter(); ch3_filter.type='highpass';
                    ch3_filter.frequency.value=baseParams.ch3.hp; ch3_filter.Q.value=0.5;
                    ch3_gain.connect(ch3_filter); ch3_filter.connect(masterGain);

                    isInit = true;
                    statusDetail.textContent='音频就绪 | 3声道';
                }catch(e){console.error(e);statusDetail.textContent='⚠️ 音频初始化失败';}
            }

            // ========== 启动/重启噪声源 ==========
            function startCh1() {
                if(ch1_source){try{ch1_source.stop();}catch(e){}ch1_source.disconnect();}
                let buf;
                const t=baseParams.ch1.type;
                if(t==='white')buf=generateWhiteBuffer(audioCtx,8);
                else if(t==='chaos')buf=generateChaosBuffer(audioCtx,6);
                else buf=generatePinkBuffer(audioCtx,8);
                ch1_source=audioCtx.createBufferSource(); ch1_source.buffer=buf; ch1_source.loop=true;
                ch1_source.connect(ch1_gain); ch1_source.start();
            }
            function startCh2() {
                if(ch2_source){try{ch2_source.stop();}catch(e){}ch2_source.disconnect();}
                let buf;
                const t=baseParams.ch2.type;
                if(t==='water')buf=generateWaterBuffer(audioCtx,6);
                else if(t==='sin')buf=generateSinBuffer(audioCtx,6);
                else buf=generatePinkBuffer(audioCtx,6);
                ch2_source=audioCtx.createBufferSource(); ch2_source.buffer=buf; ch2_source.loop=true;
                ch2_source.connect(ch2_gain); ch2_source.start();
            }
            function startCh3() {
                if(ch3_source){try{ch3_source.stop();}catch(e){}ch3_source.disconnect();}
                let buf;
                const t=baseParams.ch3.type;
                if(t==='white')buf=generateWhiteBuffer(audioCtx,6);
                else if(t==='water')buf=generateWaterBuffer(audioCtx,6);
                else buf=generateChaosBuffer(audioCtx,6);
                ch3_source=audioCtx.createBufferSource(); ch3_source.buffer=buf; ch3_source.loop=true;
                ch3_source.connect(ch3_gain); ch3_source.start();
            }
            function restartAllSources(){
                if(!isPlaying||!audioCtx) return;
                startCh1(); startCh2(); startCh3();
            }

            // ========== 应用参数 ==========
            function applyCh1(hp, volMin, volMax, q) {
                const now=audioCtx.currentTime;
                ch1_filter.frequency.setTargetAtTime(hp, now, 0.08);
                ch1_filter.Q.setTargetAtTime(clamp(q,0.1,10), now, 0.1);
                const targetVol = (volMin+volMax)/2;
                const gainVal = (targetVol/100)*0.7 * (globalGain.value/100);
                ch1_gain.gain.setTargetAtTime(gainVal, now, 0.12);
            }
            function applyCh2(lpf, vol, sub) {
                const now=audioCtx.currentTime;
                ch2_filter.frequency.setTargetAtTime(lpf, now, 0.08);
                const gainVal = (vol/100)*0.6 * (globalGain.value/100);
                ch2_gain.gain.setTargetAtTime(gainVal, now, 0.12);
                if(ch2_subGain) ch2_subGain.gain.setTargetAtTime(clamp(sub/100 * 0.4, 0, 0.4), now, 0.15);
                if(ch2_subOsc) ch2_subOsc.frequency.setTargetAtTime(30+Math.random()*30, now, 0.2);
            }
            function applyCh3(hp, vol, phaseMs) {
                const now=audioCtx.currentTime;
                ch3_filter.frequency.setTargetAtTime(hp, now, 0.08);
                const gainVal = (vol/100)*0.5 * (globalGain.value/100);
                ch3_gain.gain.setTargetAtTime(gainVal, now, 0.12);
            }
            function applyGlobalGain() {
                if(!audioCtx||!masterGain) return;
                const now=audioCtx.currentTime;
                masterGain.gain.setTargetAtTime(clamp(globalGain.value/100,0,1)*0.85, now, 0.1);
            }

            // ========== 漂移系统（三通道独立+全局突变） ==========
            function startDrift() {
                stopDrift();
                const depth = (globalDepth.value/100);
                const mutateProb = globalMutate.value/100;

                function driftUpdate() {
                    if(!isPlaying) return;
                    // 通道1
                    const base1hp = parseFloat(ch1_hp.value)||lastValid.ch1_hp;
                    const off1 = (Math.random()-0.5)*240*depth; // ±120Hz
                    let newHp1 = clamp(base1hp+off1, base1hp-120, base1hp+120); newHp1 = clamp(newHp1,50,800);
                    drifted.ch1.hp = newHp1;
                    const qOff = (Math.random()-0.5)*2*depth; let newQ = parseFloat(ch1_q.value)||lastValid.ch1_q; newQ = clamp(newQ+qOff, 0.1, 10);
                    drifted.ch1.q = newQ;
                    // vol范围飘移
                    const baseVmin=parseFloat(ch1_volMin.value)||lastValid.ch1_volMin;
                    const baseVmax=parseFloat(ch1_volMax.value)||lastValid.ch1_volMax;
                    const vOff=(Math.random()-0.5)*20*depth;
                    let vm=clamp(baseVmin+vOff,0,100), vx=clamp(baseVmax+vOff,0,100);
                    if(vm>=vx-2){vm=clamp(baseVmin-5,0,100);vx=clamp(baseVmax+5,0,100);}
                    drifted.ch1.volMin=vm; drifted.ch1.volMax=vx;
                    applyCh1(newHp1, vm, vx, newQ);

                    // 通道2
                    const base2lpf = parseFloat(ch2_lpf.value)||lastValid.ch2_lpf;
                    const off2 = (Math.random()-0.5)*280*depth; // ±140Hz
                    let newLpf = clamp(base2lpf+off2, base2lpf-140, base2lpf+140); newLpf = clamp(newLpf,30,500);
                    drifted.ch2.lpf = newLpf;
                    const v2off=(Math.random()-0.5)*20*depth;
                    let newV2=clamp((parseFloat(ch2_vol.value)||lastValid.ch2_vol)+v2off,0,100);
                    drifted.ch2.vol = newV2;
                    const subOff=(Math.random()-0.5)*20*depth;
                    let newSub=clamp((parseFloat(ch2_sub.value)||lastValid.ch2_sub)+subOff,0,100);
                    drifted.ch2.sub = newSub;
                    applyCh2(newLpf, newV2, newSub);

                    // 通道3
                    const base3hp = parseFloat(ch3_hp.value)||lastValid.ch3_hp;
                    const off3 = (Math.random()-0.5)*300*depth; // ±150Hz
                    let newHp3 = clamp(base3hp+off3, base3hp-150, base3hp+150); newHp3 = clamp(newHp3,10,800);
                    drifted.ch3.hp = newHp3;
                    const v3off=(Math.random()-0.5)*20*depth;
                    let newV3=clamp((parseFloat(ch3_vol.value)||lastValid.ch3_vol)+v3off,0,100);
                    drifted.ch3.vol = newV3;
                    const phaseOff = (Math.random()-0.5)*100*depth;
                    let newPhase=clamp((parseFloat(ch3_phaseDelay.value)||lastValid.ch3_phase)+phaseOff,0,500);
                    drifted.ch3.phaseDelay = newPhase;
                    applyCh3(newHp3, newV3, newPhase);

                    // 全局增益微调
                    const gainOff = (Math.random()-0.5)*10*depth;
                    const newGain=clamp(globalGain.value/100+gainOff/100,0,1)*100;
                    globalGain.value=Math.round(newGain); applyGlobalGain();

                    // 突变
                    if(Math.random()<mutateProb*0.15){
                        const types=['pink','white','chaos'];
                        baseParams.ch1.type=types[Math.floor(Math.random()*3)];
                        document.querySelectorAll('#ch1_type button').forEach(b=>b.classList.toggle('active',b.dataset.type===baseParams.ch1.type));
                        if(isPlaying) startCh1();
                    }
                    if(Math.random()<mutateProb*0.12){
                        const types2=['pink','water','sin'];
                        baseParams.ch2.type=types2[Math.floor(Math.random()*3)];
                        document.querySelectorAll('#ch2_type button').forEach(b=>b.classList.toggle('active',b.dataset.type===baseParams.ch2.type));
                        if(isPlaying) startCh2();
                    }
                    if(Math.random()<mutateProb*0.10){
                        const types3=['chaos','white','water'];
                        baseParams.ch3.type=types3[Math.floor(Math.random()*3)];
                        document.querySelectorAll('#ch3_type button').forEach(b=>b.classList.toggle('active',b.dataset.type===baseParams.ch3.type));
                        if(isPlaying) startCh3();
                    }

                    // 更新显示
                    m1hp.textContent = Math.round(newHp1)+'Hz';
                    m2lpf.textContent = Math.round(newLpf)+'Hz';
                    m3hp.textContent = Math.round(newHp3)+'Hz';
                    totalComplexity = (depth*100)*(0.5+Math.random()*0.5)+mutateProb*30;
                    totalComplexity = clamp(totalComplexity,0,100);
                    mComplex.textContent = Math.round(totalComplexity)+'%';
                    document.querySelectorAll('.monitor-item .m-bar-fill')[0].style.width=(clamp(newHp1/800*100,0,100))+'%';
                    document.querySelectorAll('.monitor-item .m-bar-fill')[1].style.width=(clamp(newLpf/500*100,0,100))+'%';
                    document.querySelectorAll('.monitor-item .m-bar-fill')[2].style.width=(clamp(newHp3/800*100,0,100))+'%';
                    document.querySelectorAll('.monitor-item .m-bar-fill')[3].style.width=totalComplexity+'%';

                    const delay = 300+Math.random()*600;
                    driftTimer = setTimeout(driftUpdate, delay);
                }
                driftTimer = setTimeout(driftUpdate, 400);
            }
            function stopDrift() {
                if(driftTimer){clearTimeout(driftTimer);driftTimer=null;}
            }

            // ========== 主循环 ==========
            function startUpdateLoop() {
                stopUpdateLoop();
                function step() {
                    if(!isPlaying) return;
                    const v1 = rand(drifted.ch1.volMin, drifted.ch1.volMax);
                    const v2 = rand(0, drifted.ch2.vol);
                    const v3 = rand(0, drifted.ch3.vol);
                    applyCh1(drifted.ch1.hp, drifted.ch1.volMin||20, drifted.ch1.volMax||70, drifted.ch1.q);
                    applyCh2(drifted.ch2.lpf, v2, drifted.ch2.sub);
                    applyCh3(drifted.ch3.hp, v3, drifted.ch3.phaseDelay);
                    updateTimer = setTimeout(step, 800+Math.random()*800);
                }
                step();
            }
            function stopUpdateLoop() {
                if(updateTimer){clearTimeout(updateTimer);updateTimer=null;}
            }

            // ========== 启动/停止（含iOS修复） ==========
            function startEngine() {
                if(isPlaying) return;
                if(!isInit){initAudio();if(!isInit) return;}
                // 关键：确保 AudioContext 处于运行状态（iOS Safari 需要 resume）
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().then(() => {
                        proceedStart();
                    }).catch(e => {
                        console.warn('AudioContext resume failed:', e);
                        proceedStart(); // 尝试继续
                    });
                } else {
                    proceedStart();
                }
            }
            function proceedStart() {
                if(isPlaying) return;
                collectParams();
                drifted.ch1.hp = baseParams.ch1.hp; drifted.ch2.lpf = baseParams.ch2.lpf; drifted.ch3.hp = baseParams.ch3.hp;
                drifted.ch1.volMin = baseParams.ch1.volMin; drifted.ch1.volMax = baseParams.ch1.volMax;
                drifted.ch2.vol = baseParams.ch2.vol; drifted.ch2.sub = baseParams.ch2.sub;
                drifted.ch3.vol = baseParams.ch3.vol; drifted.ch3.phaseDelay = baseParams.ch3.phaseDelay;
                startCh1(); startCh2(); startCh3();
                applyCh1(drifted.ch1.hp, drifted.ch1.volMin, drifted.ch1.volMax, baseParams.ch1.q);
                applyCh2(drifted.ch2.lpf, drifted.ch2.vol, drifted.ch2.sub);
                applyCh3(drifted.ch3.hp, drifted.ch3.vol, drifted.ch3.phaseDelay);
                applyGlobalGain();
                isPlaying = true;
                statusBadge.classList.add('active');
                statusText.textContent = '掩蔽中';
                statusDetail.textContent = '🔄 三通道 | 抗学习深度 '+globalDepth.value+'%';
                toggleLabel.textContent = '停止掩蔽';
                mainToggle.classList.add('active');
                mainToggle.querySelector('.icon-btn').textContent = '■';
                startUpdateLoop();
                startDrift();
                updateQualityDisplay();
            }

            function stopEngine() {
                if(!isPlaying) return;
                isPlaying = false;
                stopUpdateLoop();
                stopDrift();
                if(ch1_source){try{ch1_source.stop();}catch(e){}ch1_source.disconnect();}
                if(ch2_source){try{ch2_source.stop();}catch(e){}ch2_source.disconnect();}
                if(ch3_source){try{ch3_source.stop();}catch(e){}ch3_source.disconnect();}
                if(audioCtx&&masterGain) masterGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.1);
                statusBadge.classList.remove('active');
                statusText.textContent = '已停止';
                statusDetail.textContent = '⏸️ 暂停';
                toggleLabel.textContent = '启动掩蔽';
                mainToggle.classList.remove('active');
                mainToggle.querySelector('.icon-btn').textContent = '▶';
            }
            function togglePlay(){ if(isPlaying) stopEngine(); else startEngine(); }

            // ========== 参数收集 ==========
            function collectParams() {
                const hp1 = parseFloat(ch1_hp.value); if(!isNaN(hp1)){baseParams.ch1.hp=clamp(hp1,50,800);lastValid.ch1_hp=baseParams.ch1.hp;}
                const vm1=parseFloat(ch1_volMin.value); if(!isNaN(vm1)){baseParams.ch1.volMin=clamp(vm1,0,100);}
                const vx1=parseFloat(ch1_volMax.value); if(!isNaN(vx1)){baseParams.ch1.volMax=clamp(vx1,0,100);}
                const q1 = parseFloat(ch1_q.value); if(!isNaN(q1)){baseParams.ch1.q=clamp(q1,0.1,10);lastValid.ch1_q=baseParams.ch1.q;}
                const lpf2=parseFloat(ch2_lpf.value); if(!isNaN(lpf2)){baseParams.ch2.lpf=clamp(lpf2,30,500);lastValid.ch2_lpf=baseParams.ch2.lpf;}
                const v2=parseFloat(ch2_vol.value); if(!isNaN(v2)){baseParams.ch2.vol=clamp(v2,0,100);lastValid.ch2_vol=baseParams.ch2.vol;}
                const sub2=parseFloat(ch2_sub.value); if(!isNaN(sub2)){baseParams.ch2.sub=clamp(sub2,0,100);lastValid.ch2_sub=baseParams.ch2.sub;}
                const hp3=parseFloat(ch3_hp.value); if(!isNaN(hp3)){baseParams.ch3.hp=clamp(hp3,10,800);lastValid.ch3_hp=baseParams.ch3.hp;}
                const v3=parseFloat(ch3_vol.value); if(!isNaN(v3)){baseParams.ch3.vol=clamp(v3,0,100);lastValid.ch3_vol=baseParams.ch3.vol;}
                const ph3=parseFloat(ch3_phaseDelay.value); if(!isNaN(ph3)){baseParams.ch3.phaseDelay=clamp(ph3,0,500);lastValid.ch3_phase=baseParams.ch3.phaseDelay;}
                // 类型
                const active1 = document.querySelector('#ch1_type button.active');
                if(active1) baseParams.ch1.type = active1.dataset.type;
                const active2 = document.querySelector('#ch2_type button.active');
                if(active2) baseParams.ch2.type = active2.dataset.type;
                const active3 = document.querySelector('#ch3_type button.active');
                if(active3) baseParams.ch3.type = active3.dataset.type;
                // 全局
                const mut = parseFloat(globalMutate.value); if(!isNaN(mut)) baseParams.global.mutate = clamp(mut,0,100);
                const dep = parseFloat(globalDepth.value); if(!isNaN(dep)) baseParams.global.depth = clamp(dep,10,100);
                const gn = parseFloat(globalGain.value); if(!isNaN(gn)) baseParams.global.gain = clamp(gn,0,100);
            }
            function updateQualityDisplay() {
                const mainTypes = baseParams.ch1.type + '/' + baseParams.ch2.type + '/' + baseParams.ch3.type;
                qualityDisp.textContent = `📊 三通道 | ${mainTypes}`;
            }

            // ========== 重置 ==========
            function resetToDefaults() {
                if(isPlaying) stopEngine();
                ch1_hp.value=550; ch1_volMin.value=20; ch1_volMax.value=70; ch1_q.value=0.7;
                ch2_lpf.value=200; ch2_vol.value=50; ch2_sub.value=40;
                ch3_hp.value=100; ch3_vol.value=35; ch3_phaseDelay.value=0;
                globalMutate.value=75; globalDepth.value=100; globalGain.value=75;
                document.querySelectorAll('#ch1_type button').forEach(b=>b.classList.toggle('active',b.dataset.type==='pink'));
                document.querySelectorAll('#ch2_type button').forEach(b=>b.classList.toggle('active',b.dataset.type==='pink'));
                document.querySelectorAll('#ch3_type button').forEach(b=>b.classList.toggle('active',b.dataset.type==='chaos'));
                collectParams();
                drifted.ch1.hp=550; drifted.ch1.volMin=20; drifted.ch1.volMax=70; drifted.ch1.q=0.7;
                drifted.ch2.lpf=200; drifted.ch2.vol=50; drifted.ch2.sub=40;
                drifted.ch3.hp=100; drifted.ch3.vol=35; drifted.ch3.phaseDelay=0;
                m1hp.textContent='550Hz'; m2lpf.textContent='200Hz'; m3hp.textContent='100Hz'; mComplex.textContent='75%';
                document.querySelectorAll('.monitor-item .m-bar-fill')[0].style.width='69%';
                document.querySelectorAll('.monitor-item .m-bar-fill')[1].style.width='40%';
                document.querySelectorAll('.monitor-item .m-bar-fill')[2].style.width='50%';
                document.querySelectorAll('.monitor-item .m-bar-fill')[3].style.width='75%';
                updateQualityDisplay();
                statusDetail.textContent='已重置 · 三通道默认';
            }

            // ========== 事件绑定 ==========
            function applyAllChannels() {
                if(!isPlaying||!audioCtx) return;
                applyCh1(drifted.ch1.hp, drifted.ch1.volMin, drifted.ch1.volMax, drifted.ch1.q);
                applyCh2(drifted.ch2.lpf, drifted.ch2.vol, drifted.ch2.sub);
                applyCh3(drifted.ch3.hp, drifted.ch3.vol, drifted.ch3.phaseDelay);
                applyGlobalGain();
            }
            function setType(selector, baseKey, startFn) {
                const btns = document.querySelectorAll(selector+' button');
                btns.forEach(b=>b.addEventListener('click',()=>{
                    btns.forEach(x=>x.classList.remove('active'));
                    b.classList.add('active');
                    baseParams[baseKey].type = b.dataset.type;
                    updateQualityDisplay();
                    if(isPlaying) startFn();
                }));
            }
            setType('#ch1_type', 'ch1', startCh1);
            setType('#ch2_type', 'ch2', startCh2);
            setType('#ch3_type', 'ch3', startCh3);

            [ch1_hp, ch1_volMin, ch1_volMax, ch1_q, ch2_lpf, ch2_vol, ch2_sub, ch3_hp, ch3_vol, ch3_phaseDelay, globalMutate, globalDepth, globalGain].forEach(el=>{
                el.addEventListener('input', ()=>{collectParams(); if(isPlaying) applyAllChannels();});
                el.addEventListener('change', ()=>{collectParams(); if(isPlaying) applyAllChannels();});
            });

            mainToggle.addEventListener('click', togglePlay);
            resetBtn.addEventListener('click', resetToDefaults);

            // ========== 初始化 ==========
            function init() {
                // 默认值已设为 75 和 75
                document.querySelectorAll('#ch1_type button').forEach(b=>b.classList.toggle('active',b.dataset.type==='pink'));
                document.querySelectorAll('#ch2_type button').forEach(b=>b.classList.toggle('active',b.dataset.type==='pink'));
                document.querySelectorAll('#ch3_type button').forEach(b=>b.classList.toggle('active',b.dataset.type==='chaos'));
                collectParams();
                updateQualityDisplay();
                initAudio();
                statusDetail.textContent='🎛️ 三通道抗学习 · 白色主题';
                mComplex.textContent='75%';
                // 确保全局显示
                document.querySelectorAll('.monitor-item .m-bar-fill')[3].style.width='75%';
            }
            if(document.readyState==='complete') init();
            else window.addEventListener('load', init);
        })();
    </script>
</body>
